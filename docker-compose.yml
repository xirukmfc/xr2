services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: xr2_postgres
    environment:
      POSTGRES_DB: xr2_db
      POSTGRES_USER: xr2_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-***REMOVED_PG_PWD***}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    ports:
      - "5432:5432"
    networks:
      - xr2_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xr2_user -d xr2_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis для кэширования и rate limiting
  redis:
    image: redis:7-alpine
    container_name: xr2_redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-***REMOVED_REDIS_PWD***}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - xr2_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Инициализация базы данных (запускается только один раз)
  db-init:
    build: .
    container_name: xr2_db_init
    environment:
      DATABASE_URL: postgresql+asyncpg://xr2_user:${POSTGRES_PASSWORD:-***REMOVED_PG_PWD***}@postgres:5432/xr2_db
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: xr2_user
      DB_PASSWORD: ${POSTGRES_PASSWORD:-***REMOVED_PG_PWD***}
      DB_NAME: xr2_db

      # Security
      SECRET_KEY: ${SECRET_KEY:-your_super_secret_key_change_in_production}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-***REMOVED_ADMIN_PWD***}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-pavel.kuzko@gmail.com}

      # OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-dummy_client_id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-dummy_client_secret}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - xr2_network
    command: >
      sh -c "
        echo '🚀 Starting database initialization...' &&
        echo '⏳ Waiting for database...' &&
        while ! pg_isready -h postgres -p 5432 -U xr2_user -d xr2_db; do
          echo '   Database not ready, waiting...'
          sleep 2
        done &&
        echo '✅ Database is ready!' &&
        echo '📋 Creating database tables...' &&
        python -c 'import asyncio; from app.core.database import init_db; asyncio.run(init_db())' &&
        echo '✅ Tables created!' &&
        echo '🔄 Stamping database migrations...' &&
        alembic stamp head &&
        echo '✅ Migrations stamped!' &&
        echo '🤖 Initializing LLM providers...' &&
        python scripts/init_db.py &&
        echo '✅ LLM providers initialized!' &&
        echo '🎉 Database initialization completed!'
      "
    restart: "no"

  # Основное приложение
  app:
    build: .
    container_name: xr2_app
    environment:
      # Database
      DATABASE_URL: postgresql+asyncpg://xr2_user:${POSTGRES_PASSWORD:-***REMOVED_PG_PWD***}@postgres:5432/xr2_db

      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD:-***REMOVED_REDIS_PWD***}@redis:6379/0

      # Security
      SECRET_KEY: ${SECRET_KEY:-your_super_secret_key_change_in_production}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-***REMOVED_ADMIN_PWD***}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-pavel.kuzko@gmail.com}

      # OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-dummy_client_id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-dummy_client_secret}

      # API Security
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-100}

      # Environment
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}

      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-*}

      # API Server URL for Swagger docs
      API_SERVER_URL: ${API_SERVER_URL:-http://localhost:8000}

      # Database connection for scripts
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: xr2_user
      DB_PASSWORD: ${POSTGRES_PASSWORD:-***REMOVED_PG_PWD***}
      DB_NAME: xr2_db
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks:
      - xr2_network
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
      - ./app:/app/app
      - ./main.py:/app/main.py
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend (Next.js)
  frontend:
    build:
      context: ./prompt-editor
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost/internal
    container_name: xr2_frontend
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
    ports:
      - "3000:3000"
    depends_on:
      - app
    networks:
      - xr2_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx reverse proxy с защитой
  nginx:
    image: nginx:alpine
    container_name: xr2_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - app
      - frontend
    networks:
      - xr2_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: xr2_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - xr2_network
    restart: unless-stopped

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: xr2_grafana
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - postgres
      - prometheus
    networks:
      - xr2_network
    restart: unless-stopped

  # Node Exporter for system metrics (CPU, RAM, Disk, Network)
  node-exporter:
    image: prom/node-exporter:latest
    container_name: xr2_node_exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - xr2_network
    restart: unless-stopped

  # cAdvisor for Docker container metrics
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: xr2_cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      - xr2_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  nginx_logs:
  prometheus_data:
  grafana_data:

networks:
  xr2_network:
    driver: bridge
