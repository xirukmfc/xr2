user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# Ограничения для защиты от DDoS
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ============================================
    # Cloudflare: Trust Cloudflare IPs for real_ip
    # https://www.cloudflare.com/ips/
    # ============================================
    # IPv4
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    # IPv6
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    # Use CF-Connecting-IP header to get real visitor IP
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # Логирование
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # Основные настройки безопасности
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Ограничения размера запросов
    client_max_body_size 10M;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;

    # Таймауты
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;

    # Gzip сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ============================================
    # Cloudflare: строгая проверка по IP edge нод
    # Используем реальный адрес до real_ip подмены (realip_remote_addr)
    # ============================================
    geo $realip_remote_addr $is_from_cloudflare_ip {
        default 0;
        173.245.48.0/20 1;
        103.21.244.0/22 1;
        103.22.200.0/22 1;
        103.31.4.0/22 1;
        141.101.64.0/18 1;
        108.162.192.0/18 1;
        190.93.240.0/20 1;
        188.114.96.0/20 1;
        197.234.240.0/22 1;
        198.41.128.0/17 1;
        162.158.0.0/15 1;
        104.16.0.0/13 1;
        104.24.0.0/14 1;
        172.64.0.0/13 1;
        131.0.72.0/22 1;
        2400:cb00::/32 1;
        2606:4700::/32 1;
        2803:f800::/32 1;
        2405:b500::/32 1;
        2405:8100::/32 1;
        2a06:98c0::/29 1;
        2c0f:f248::/32 1;
    }

    # ============================================
    # WAF: Blocked IPs (known attackers)
    # Updated: 2025-12-20 - Added RCE/botnet attackers
    # ============================================
    geo $blocked_ip {
        default 0;
        5.255.121.141 1;   # Botnet C2 server
        87.121.84.154 1;   # Active RCE attacker - Mirai botnet
        45.156.87.177 1;   # Go-http-client scanner
        185.242.226.15 1;  # TLS scanner
        149.104.11.196 1;  # WordPress scanner
        # Add more malicious IPs here as needed
    }

    # ============================================
    # WAF: Map for suspicious patterns in URI
    # ============================================
    map $request_uri $suspicious_uri {
        default 0;
        # Command injection patterns
        "~*\$\(" 1;
        "~*`.*`" 1;
        "~*;\s*(wget|curl|chmod|bash|sh|nc)" 1;
        "~*\|\s*(wget|curl|chmod|bash|sh|nc)" 1;
        # Path traversal
        "~*\.\.\/" 1;
        "~*\.\.%2[fF]" 1;
        # SQL injection
        "~*union\s+select" 1;
        "~*;\s*(drop|delete|update|insert)" 1;
        # XSS
        "~*<script" 1;
        "~*javascript:" 1;
        # Known malware patterns
        "~*wget\s+http" 1;
        "~*curl\s+http" 1;
        "~*/bin/(sh|bash)" 1;
        "~*x86" 1;
        "~*MEOW" 1;
    }

    # ============================================
    # WAF: Map for suspicious User-Agent (Cloudflare handles most bots)
    # ============================================
    map $http_user_agent $suspicious_agent {
        default 0;
        "~*sqlmap" 1;
        "~*nikto" 1;
        "~*nmap" 1;
        "~*masscan" 1;
        "~*zgrab" 1;
        "~*dirbuster" 1;
        "~*gobuster" 1;
        "~*nuclei" 1;
        # Note: curl/wget/python-requests removed - Cloudflare handles bot filtering
    }

    # TGSight access control via cookie (xr2.uk + xr2.site)
    map $cookie_tgsight_access $tgsight_auth {
        default 0;
        "__TGSIGHT_UNLOCK_TOKEN__" 1;
    }

    # Rate limiting зоны (PRODUCTION - более строгие лимиты)
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=tgsight:10m rate=10r/s;

    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;
    limit_conn_zone $server_name zone=conn_limit_per_server:10m;

    # Upstream для приложения
    upstream xr2_app {
        server app:8000;
        keepalive 32;
    }

    # Upstream для фронтенда (запущен локально)
    upstream xr2_frontend {
        server frontend:3000;
        keepalive 32;
    }

    # Upstream для TGSight 2.0 (временный проект)
    upstream tgsight_app {
        server tgsight:3001;
        keepalive 32;
    }

    # Upstream для Grafana
    upstream xr2_grafana_prod {
        server grafana:3000;
        keepalive 32;
    }

    # Upstream для Prometheus
    upstream xr2_prometheus_prod {
        server prometheus:9090;
        keepalive 32;
    }

    # Upstream для Documentation
    upstream xr2_docs {
        server docs:80;
        keepalive 32;
    }

    # Редирект с HTTP на HTTPS
    # Специальный сервер для внутренних health-check'ов (без Cloudflare заголовков)
    server {
        listen 80;
        listen [::]:80;
        server_name localhost;

        access_log off;

        location /health {
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }

    server {
        listen 80;
        server_name xr2.uk www.xr2.uk;

        # Block direct access (must come through Cloudflare)
        if ($is_from_cloudflare_ip = 0) {
            return 403;
        }

        # Редирект всех запросов на HTTPS
        return 301 https://$server_name$request_uri;
    }

    # ============================================
    # xr2.site — прямой домен для РФ (без Cloudflare)
    # ============================================
    server {
        listen 80;
        server_name xr2.site www.xr2.site;

        # Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Редирект на HTTPS
        return 301 https://$server_name$request_uri;
    }

    # HTTP redirect for docs subdomain
    server {
        listen 80;
        server_name docs.xr2.uk;

        # Block direct access (must come through Cloudflare)
        if ($is_from_cloudflare_ip = 0) {
            return 403;
        }

        return 301 https://$server_name$request_uri;
    }

    # Documentation HTTPS сервер (docs.xr2.uk)
    server {
        listen 443 ssl;
        http2 on;
        server_name docs.xr2.uk;

        # SSL конфигурация (использует тот же сертификат - wildcard или multi-domain)
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;

        # Block direct access (must come through Cloudflare)
        if ($is_from_cloudflare_ip = 0) {
            return 403;
        }

        # Rate limiting
        limit_req zone=general burst=50 nodelay;
        limit_req_status 429;

        # Redirect /ru/ to / — docs.xr2.uk is English only
        location /ru/ {
            return 301 /;
        }

        location / {
            proxy_pass http://xr2_docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://xr2_docs;
            proxy_set_header Host $host;
            proxy_cache_valid 200 60m;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }

    # Основной HTTPS сервер
    server {
        listen 443 ssl;
        http2 on;
        server_name xr2.uk www.xr2.uk;

        # SSL конфигурация
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # SSL настройки безопасности
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        # HSTS (опционально, но рекомендуется)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Ограничения соединений (более строгие)
        limit_conn conn_limit_per_ip 100;
        limit_conn conn_limit_per_server 500;

        # Базовые заголовки безопасности
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://accounts.google.com https://static.cloudflareinsights.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://accounts.google.com; img-src 'self' data: blob: https://www.googletagmanager.com https://api.producthunt.com https://cdn-b.saashub.com; font-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self' https://www.google-analytics.com https://www.googleapis.com https://accounts.google.com https://region1.google-analytics.com https://cloudflareinsights.com https://cdn.jsdelivr.net; worker-src 'self' blob:; frame-src https://accounts.google.com;" always;

        # ============================================
        # Cloudflare: Block direct access (bypass protection)
        # ============================================
        if ($is_from_cloudflare_ip = 0) {
            return 403;
        }

        # ============================================
        # WAF: Block malicious IPs
        # ============================================
        if ($blocked_ip) {
            return 403;
        }

        # ============================================
        # WAF: Block suspicious URIs
        # ============================================
        if ($suspicious_uri) {
            return 403;
        }

        # ============================================
        # WAF: Block suspicious User-Agents
        # ============================================
        if ($suspicious_agent) {
            return 403;
        }

        # ============================================
        # МОНИТОРИНГ (В САМОМ ВЕРХУ)
        # ============================================

        # Grafana (uses its own built-in authentication)
        location ^~ /grafana/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_pass http://xr2_grafana_prod/grafana/;

            # Отключаем редиректы от самой Grafana, если она захочет их сделать
            proxy_redirect off;

            # WebSocket support для Grafana Live
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Grafana требует unsafe-eval для работы дашбордов
            add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval'" always;
        }

        location = /grafana {
            return 301 /grafana/;
        }

        # Prometheus (protected with Basic Auth)
        location ^~ /prometheus/ {
            # Basic Auth защита (те же credentials что и Grafana)
            auth_basic "Prometheus Monitoring";
            auth_basic_user_file /etc/nginx/.htpasswd_grafana;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_pass http://xr2_prometheus_prod/prometheus/;
        }

        location = /prometheus {
            return 301 /prometheus/;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Frontend application (Next.js)
        location / {
            limit_req zone=general burst=50 nodelay;
            limit_req_status 429;

            proxy_pass http://xr2_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support for Next.js HMR
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Next.js static files
        location /_next/ {
            proxy_pass http://xr2_frontend;
            proxy_set_header Host $host;
            proxy_cache_valid 200 60m;
            add_header Cache-Control "public, immutable";
        }

        # TGSight access: secret unlock URL sets cookie (valid 30 days)
        location = /tgsight-unlock/__TGSIGHT_UNLOCK_TOKEN__ {
            add_header Set-Cookie "tgsight_access=__TGSIGHT_UNLOCK_TOKEN__; Path=/tgsight; Max-Age=2592000; Secure; HttpOnly; SameSite=Lax" always;
            return 302 /tgsight;
        }

        # TGSight static files (_next) - более специфичное префиксное правило должно быть перед общим
        location /tgsight/_next/ {
            if ($tgsight_auth = 0) { return 403; }
            proxy_pass http://tgsight_app;
            proxy_set_header Host $host;
            proxy_cache_valid 200 60m;
            add_header Cache-Control "public, immutable";
        }

        # TGSight public static files (screenshots) - более специфичное префиксное правило должно быть перед общим
        location /tgsight/screenshots/ {
            if ($tgsight_auth = 0) { return 403; }
            proxy_pass http://tgsight_app;
            proxy_set_header Host $host;
            proxy_cache_valid 200 60m;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # TGSight public static files (images) - более специфичное префиксное правило должно быть перед общим
        location /tgsight/images/ {
            if ($tgsight_auth = 0) { return 403; }
            proxy_pass http://tgsight_app;
            proxy_set_header Host $host;
            proxy_cache_valid 200 60m;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # TGSight public static files (admin images only) - только изображения, не HTML страницы
        location ~ ^/tgsight/admin/.*\.(png|jpg|jpeg|gif|svg|webp|ico)$ {
            if ($tgsight_auth = 0) { return 403; }
            proxy_pass http://tgsight_app;
            proxy_set_header Host $host;
            proxy_cache_valid 200 60m;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # TGSight 2.0 - Временный проект для демонстрации (общее правило в конце)
        location /tgsight {
            if ($tgsight_auth = 0) { return 403; }

            # Rate limiting для TGSight (увеличен для нормальной загрузки страницы)
            limit_req zone=tgsight burst=30 nodelay;
            limit_req_status 429;

            # Ограничение соединений (увеличено с 5 до 20 для Next.js)
            limit_conn conn_limit_per_ip 100;

            proxy_pass http://tgsight_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support for Next.js
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Ограничение размера запроса для tgsight
            client_max_body_size 1M;
        }

        # Public share API (handled by Next.js)
        location /api/share/ {
            limit_req zone=general burst=50 nodelay;
            limit_req_status 429;

            proxy_pass http://xr2_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }

        # Tokenize API (handled by Next.js)
        location /api/tokenize/ {
            limit_req zone=api burst=50 nodelay;
            limit_req_status 429;

            proxy_pass http://xr2_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # API endpoints с rate limiting
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            limit_req_status 429;

            proxy_pass http://xr2_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Таймауты
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;

            # Буферизация
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }

        # Admin endpoints с дополнительной защитой
        location /admin {
            limit_req zone=login burst=20 nodelay;
            limit_req_status 429;

            # Дополнительная проверка IP (можно настроить whitelist)
            # allow 192.168.1.0/24;
            # deny all;

            proxy_pass http://xr2_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            # Важные настройки для правильной работы редиректов
            proxy_redirect off;
        }

        # Admin API docs (disabled in production)
        location /admin-docs {
            return 404;
        }

        # OpenAPI JSON schema (used by /docs Swagger UI)
        location /openapi.json {
            proxy_pass http://xr2_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Public API Swagger docs
        # Swagger UI static assets (served by FastAPI)
        location /static/ {
            proxy_pass http://xr2_app;
            proxy_set_header Host $host;
            proxy_cache_valid 200 60m;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location /docs {
            limit_req zone=general burst=50 nodelay;
            limit_req_status 429;

            proxy_pass http://xr2_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Internal API endpoints (не показываются в публичной документации)
        location /internal/ {
            limit_req zone=api burst=50 nodelay;
            limit_req_status 429;

            proxy_pass http://xr2_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Блокировка подозрительных запросов (расширения скриптов)
        location ~* \.(php|asp|aspx|jsp)$ {
            return 444;
        }

        # Note: Bot filtering removed - Cloudflare Bot Fight Mode handles this
    }

    # ============================================
    # xr2.site — HTTPS сервер для РФ (без Cloudflare)
    # ============================================
    server {
        listen 443 ssl;
        http2 on;
        server_name xr2.site www.xr2.site;

        # SSL конфигурация (Let's Encrypt)
        ssl_certificate /etc/letsencrypt/live/xr2.site/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/xr2.site/privkey.pem;

        # SSL настройки безопасности
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL_SITE:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        # HSTS
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Ограничения соединений
        limit_conn conn_limit_per_ip 100;
        limit_conn conn_limit_per_server 500;

        # Базовые заголовки безопасности
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://accounts.google.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://accounts.google.com; img-src 'self' data: blob: https://www.googletagmanager.com https://img.shields.io https://api.producthunt.com https://cdn-b.saashub.com; font-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self' https://www.google-analytics.com https://www.googleapis.com https://accounts.google.com https://region1.google-analytics.com https://cdn.jsdelivr.net; worker-src 'self' blob:; frame-src https://accounts.google.com;" always;

        # NO Cloudflare IP check — direct access

        # ============================================
        # WAF: Block malicious IPs
        # ============================================
        if ($blocked_ip) {
            return 403;
        }

        # ============================================
        # WAF: Block suspicious URIs
        # ============================================
        if ($suspicious_uri) {
            return 403;
        }

        # ============================================
        # WAF: Block suspicious User-Agents
        # ============================================
        if ($suspicious_agent) {
            return 403;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Frontend application (Next.js)
        location / {
            limit_req zone=general burst=50 nodelay;
            limit_req_status 429;

            proxy_pass http://xr2_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support for Next.js HMR
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Next.js static files
        location /_next/ {
            proxy_pass http://xr2_frontend;
            proxy_set_header Host $host;
            proxy_cache_valid 200 60m;
            add_header Cache-Control "public, immutable";
        }

        # TGSight access: secret unlock URL sets cookie (valid 30 days)
        location = /tgsight-unlock/__TGSIGHT_UNLOCK_TOKEN__ {
            add_header Set-Cookie "tgsight_access=__TGSIGHT_UNLOCK_TOKEN__; Path=/tgsight; Max-Age=2592000; Secure; HttpOnly; SameSite=Lax" always;
            return 302 /tgsight;
        }

        # TGSight static files (_next)
        location /tgsight/_next/ {
            if ($tgsight_auth = 0) { return 403; }
            proxy_pass http://tgsight_app;
            proxy_set_header Host $host;
            proxy_cache_valid 200 60m;
            add_header Cache-Control "public, immutable";
        }

        # TGSight public static files (screenshots)
        location /tgsight/screenshots/ {
            if ($tgsight_auth = 0) { return 403; }
            proxy_pass http://tgsight_app;
            proxy_set_header Host $host;
            proxy_cache_valid 200 60m;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # TGSight public static files (images)
        location /tgsight/images/ {
            if ($tgsight_auth = 0) { return 403; }
            proxy_pass http://tgsight_app;
            proxy_set_header Host $host;
            proxy_cache_valid 200 60m;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # TGSight public static files (admin images only)
        location ~ ^/tgsight/admin/.*\.(png|jpg|jpeg|gif|svg|webp|ico)$ {
            if ($tgsight_auth = 0) { return 403; }
            proxy_pass http://tgsight_app;
            proxy_set_header Host $host;
            proxy_cache_valid 200 60m;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # TGSight 2.0
        location /tgsight {
            if ($tgsight_auth = 0) { return 403; }

            limit_req zone=tgsight burst=30 nodelay;
            limit_req_status 429;
            limit_conn conn_limit_per_ip 100;

            proxy_pass http://tgsight_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            client_max_body_size 1M;
        }

        # Public share API (handled by Next.js)
        location /api/share/ {
            limit_req zone=general burst=50 nodelay;
            limit_req_status 429;

            proxy_pass http://xr2_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }

        # Tokenize API (handled by Next.js)
        location /api/tokenize/ {
            limit_req zone=api burst=50 nodelay;
            limit_req_status 429;

            proxy_pass http://xr2_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # API endpoints с rate limiting
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            limit_req_status 429;

            proxy_pass http://xr2_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;

            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }

        # Admin endpoints
        location /admin {
            limit_req zone=login burst=20 nodelay;
            limit_req_status 429;

            proxy_pass http://xr2_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            proxy_redirect off;
        }

        # OpenAPI JSON schema (used by /docs Swagger UI)
        location /openapi.json {
            proxy_pass http://xr2_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Swagger UI static assets
        location /static/ {
            proxy_pass http://xr2_app;
            proxy_set_header Host $host;
            proxy_cache_valid 200 60m;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location /docs {
            limit_req zone=general burst=50 nodelay;
            limit_req_status 429;

            proxy_pass http://xr2_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Internal API endpoints
        location /internal/ {
            limit_req zone=api burst=50 nodelay;
            limit_req_status 429;

            proxy_pass http://xr2_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Documentation (MkDocs) — proxied at /documentation/
        # Default to Russian version for xr2.site users
        location = /documentation/ {
            return 302 /documentation/ru/;
        }

        location /documentation/ {
            limit_req zone=general burst=50 nodelay;
            limit_req_status 429;

            proxy_pass http://xr2_docs/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Fix MkDocs absolute language switcher links
            sub_filter 'href="/"' 'href="/documentation/"';
            sub_filter 'href="/ru/"' 'href="/documentation/ru/"';
            sub_filter_once off;
            sub_filter_types text/html;

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Блокировка подозрительных запросов (расширения скриптов)
        location ~* \.(php|asp|aspx|jsp)$ {
            return 444;
        }
    }
}
