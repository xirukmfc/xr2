services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: xr2_postgres_prod
    environment:
      POSTGRES_DB: xr2_db
      POSTGRES_USER: xr2_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-***REMOVED_PG_PWD***}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    networks:
      - xr2_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xr2_user -d xr2_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: xr2_redis_prod
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-***REMOVED_REDIS_PWD***} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data_prod:/data
    networks:
      - xr2_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Database initialization
  db-init:
    build: .
    container_name: xr2_db_init_prod
    environment:
      DATABASE_URL: postgresql+asyncpg://xr2_user:${POSTGRES_PASSWORD:-***REMOVED_PG_PWD***}@postgres:5432/xr2_db
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: xr2_user
      DB_PASSWORD: ${POSTGRES_PASSWORD:-***REMOVED_PG_PWD***}
      DB_NAME: xr2_db
      SECRET_KEY: ${SECRET_KEY:-your_super_secret_key_change_in_production}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-***REMOVED_ADMIN_PWD***}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-pavel.kuzko@gmail.com}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-dummy_client_id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-dummy_client_secret}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - xr2_network
    command: >
      sh -c "
        echo '🚀 Starting database initialization...' &&
        echo '⏳ Waiting for database...' &&
        while ! pg_isready -h postgres -p 5432 -U xr2_user -d xr2_db; do
          echo '   Database not ready, waiting...'
          sleep 2
        done &&
        echo '✅ Database is ready!' &&
        echo '📋 Creating database tables...' &&
        python -c 'import asyncio; from app.core.database import init_db; asyncio.run(init_db())' &&
        echo '✅ Tables created!' &&
        echo '🔄 Stamping database migrations...' &&
        alembic stamp head &&
        echo '✅ Migrations stamped!' &&
        echo '🤖 Initializing LLM providers...' &&
        python scripts/init_db.py &&
        echo '✅ LLM providers initialized!' &&
        echo '🎉 Database initialization completed!'
      "
    restart: "no"

  # Backend application
  app:
    build: .
    container_name: xr2_app_prod
    environment:
      DATABASE_URL: postgresql+asyncpg://xr2_user:${POSTGRES_PASSWORD:-***REMOVED_PG_PWD***}@postgres:5432/xr2_db
      REDIS_URL: redis://:${REDIS_PASSWORD:-***REMOVED_REDIS_PWD***}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-your_super_secret_key_change_in_production}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-***REMOVED_ADMIN_PWD***}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-pavel.kuzko@gmail.com}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-dummy_client_id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-dummy_client_secret}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-100}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}

      # YooKassa payment
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      YOOKASSA_TEST_MODE: ${YOOKASSA_TEST_MODE:-true}
      YOOKASSA_RETURN_URL: ${YOOKASSA_RETURN_URL:-https://xr2.site/settings}

      # LemonSqueezy payment
      LEMONSQUEEZY_API_KEY: ${LEMONSQUEEZY_API_KEY:-}
      LEMONSQUEEZY_WEBHOOK_SECRET: ${LEMONSQUEEZY_WEBHOOK_SECRET:-}
      LEMONSQUEEZY_TEST_MODE: ${LEMONSQUEEZY_TEST_MODE:-false}
      LEMONSQUEEZY_VARIANT_ID: ${LEMONSQUEEZY_VARIANT_ID:-1262461}
      LEMONSQUEEZY_RETURN_URL: ${LEMONSQUEEZY_RETURN_URL:-https://xr2.uk/settings}

      # API Server URL for Swagger public_docs (production)
      API_SERVER_URL: https://xr2.uk

      FORWARDED_ALLOW_IPS: "*"
      ROOT_PATH: ""

      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: xr2_user
      DB_PASSWORD: ${POSTGRES_PASSWORD:-***REMOVED_PG_PWD***}
      DB_NAME: xr2_db
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks:
      - xr2_network
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend (Next.js)
  frontend:
    build:
      context: ./prompt-editor
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /internal
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_ENABLE_PASSWORD_LOGIN: ${NEXT_PUBLIC_ENABLE_PASSWORD_LOGIN:-false}
        BUILDKIT_INLINE_CACHE: 1
      shm_size: '2gb'
      # Use BuildKit cache mounts for faster rebuilds
      cache_from:
        - xr2-frontend:latest
    container_name: xr2_frontend_prod
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
    depends_on:
      - app
    networks:
      - xr2_network
    restart: unless-stopped
    # Увеличенные лимиты ресурсов для сборки и работы
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Documentation (MkDocs)
  docs:
    build:
      context: ./public_docs
      dockerfile: Dockerfile
    container_name: xr2_docs_prod
    networks:
      - xr2_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # TGSight 2.0 - Временный проект для демонстрации
  tgsight:
    build:
      context: ./tgsight2.0
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
      shm_size: '2gb'
    container_name: xr2_tgsight_prod
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
    networks:
      - xr2_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://0.0.0.0:3001/tgsight"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: xr2_prometheus_prod
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data_prod:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
      - '--web.external-url=/prometheus'
      - '--web.route-prefix=/prometheus'
    networks:
      - xr2_network
    restart: unless-stopped

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: xr2_grafana_prod
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://xr2.uk/grafana
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data_prod:/var/lib/grafana
    depends_on:
      - postgres
      - prometheus
    networks:
      - xr2_network
    restart: unless-stopped

  # Node Exporter for system_docs metrics (CPU, RAM, Disk, Network)
  node-exporter:
    image: prom/node-exporter:latest
    container_name: xr2_node_exporter_prod
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - xr2_network
    restart: unless-stopped

  # cAdvisor for Docker container metrics
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: xr2_cadvisor_prod
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      - xr2_network
    restart: unless-stopped

  # Nginx
  nginx:
    image: nginx:alpine
    container_name: xr2_nginx_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - ./nginx/.htpasswd_grafana:/etc/nginx/.htpasswd_grafana:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - nginx_logs_prod:/var/log/nginx
      - ./portfolio:/usr/share/nginx/portfolio:ro
    depends_on:
      - app
      - frontend
      - tgsight
      - docs
      - grafana
      - prometheus
      - node-exporter
      - cadvisor
    networks:
      - xr2_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data_prod:
  redis_data_prod:
  nginx_logs_prod:
  prometheus_data_prod:
  grafana_data_prod:

networks:
  xr2_network:
    driver: bridge
