# Redis Security Configuration for xR2 Platform
# Applied to production environment

# Enable AOF persistence
appendonly yes

# Password protection (will be overridden by command line --requirepass)
# requirepass ***REMOVED_REDIS_PWD***

# Disable dangerous commands
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command CONFIG ""
rename-command DEBUG ""
rename-command SHUTDOWN ""

# Memory limits
maxmemory 512mb
maxmemory-policy allkeys-lru

# Network security
bind 0.0.0.0
protected-mode yes

# Logging
loglevel notice

# Performance
tcp-backlog 511
timeout 0
tcp-keepalive 300
