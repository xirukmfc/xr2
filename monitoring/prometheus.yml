global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

scrape_configs:
  # Мониторинг самого Prometheus (с учётом subpath)
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: '/prometheus/metrics'

  # Мониторинг Node Exporter (системные метрики: CPU, RAM, Disk, Network)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s

  # Мониторинг cAdvisor (метрики Docker контейнеров)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 15s

  # TODO: Добавить exporters для полного мониторинга:
  # - postgres_exporter (порт 9187) - метрики PostgreSQL
  # - redis_exporter (порт 9121) - метрики Redis
  # - nginx-prometheus-exporter (порт 9113) - метрики Nginx
  # - prometheus middleware в FastAPI - метрики приложения









