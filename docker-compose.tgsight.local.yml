services:
  # TGSight 2.0 - Локальная разработка с hot reload (без basePath)
  tgsight-local:
    build:
      context: ./tgsight2.0
      dockerfile: Dockerfile.dev
    container_name: xr2_tgsight_local
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_BASE_PATH: ""
      PORT: 3001
      HOSTNAME: "0.0.0.0"
    ports:
      - "3001:3001"
    volumes:
      # Mount source code for hot reload
      - ./tgsight2.0:/app
      - /app/node_modules
      - /app/.next
    networks:
      - xr2_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://0.0.0.0:3001"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  xr2_network:
    driver: bridge

