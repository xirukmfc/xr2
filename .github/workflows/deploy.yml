name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Действие'
        required: true
        type: choice
        options:
          - git-pull
          - git-force-pull
          - cleanup-docker
          - rebuild-all
          - rebuild-app
          - rebuild-frontend
          - rebuild-frontend-nocache
          - rebuild-docs
          - rebuild-nginx

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Execute on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd /opt/xr2
            ACTION="${{ github.event.inputs.action }}"

            echo "=========================================="
            echo "Action: $ACTION"
            echo "=========================================="

            # Git Pull (с автомержем локальных изменений)
            if [ "$ACTION" = "git-pull" ]; then
              git stash
              git pull
              git stash pop || true
            fi

            # Git Force Pull (сбросит локальные изменения!)
            if [ "$ACTION" = "git-force-pull" ]; then
              git fetch origin
              git reset --hard origin/master
            fi

            # Очистка Docker
            if [ "$ACTION" = "cleanup-docker" ]; then
              docker system prune -af
              docker volume prune -f
            fi

            # Rebuild ALL (без кэша)
            if [ "$ACTION" = "rebuild-all" ]; then
              git fetch origin
              git reset --hard origin/master
              docker compose --env-file .env.prod -f docker-compose.prod.yml build --no-cache
              docker compose --env-file .env.prod -f docker-compose.prod.yml up -d
            fi

            # Rebuild App
            if [ "$ACTION" = "rebuild-app" ]; then
              git fetch origin
              git reset --hard origin/master
              docker compose --env-file .env.prod -f docker-compose.prod.yml build --no-cache app
              docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --no-deps app
            fi

            # Rebuild Frontend (with cache - much faster)
            if [ "$ACTION" = "rebuild-frontend" ]; then
              git fetch origin
              git reset --hard origin/master
              DOCKER_BUILDKIT=1 docker compose --env-file .env.prod -f docker-compose.prod.yml build frontend
              docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --no-deps frontend
            fi

            # Rebuild Frontend (no cache - use only when dependencies change)
            if [ "$ACTION" = "rebuild-frontend-nocache" ]; then
              git fetch origin
              git reset --hard origin/master
              docker compose --env-file .env.prod -f docker-compose.prod.yml build --no-cache frontend
              docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --no-deps frontend
            fi

            # Rebuild Docs
            if [ "$ACTION" = "rebuild-docs" ]; then
              git fetch origin
              git reset --hard origin/master
              docker compose --env-file .env.prod -f docker-compose.prod.yml build --no-cache docs
              docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --no-deps docs
            fi

            # Rebuild Nginx
            if [ "$ACTION" = "rebuild-nginx" ]; then
              git fetch origin
              git reset --hard origin/master
              docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --no-deps --force-recreate nginx
            fi

            echo "=========================================="
            echo "Done!"
            echo "=========================================="
            docker ps --format "table {{.Names}}\t{{.Status}}"
